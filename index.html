<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quant Desk</title>
<meta name="description" content="Learn quantitative trading and quant finance by doing: interactive labs, adaptive daily practice, market-making games and a public practice log.">
<meta name="theme-color" content="#14212b">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2314212b'/%3E%3Cpath d='M8 21h7M17 11h7' stroke='%236b9cff' stroke-width='3' stroke-linecap='round'/%3E%3Cpath d='M12 9l8 14' stroke='%23fff' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="wrap">
  <header>
    <div style="display:flex;flex-direction:column;gap:6px">
      <span class="tag">Quant finance practice</span>
      <h1>Quant<span>/</span>Desk</h1>
    </div>
    <div class="strip tabular">
      <span>Streak <b id="sStreak">0</b>d</span>
      <span>Today <b id="sToday">0</b> qs</span>
      <span>Accuracy 7d <b id="sAcc">–</b></span>
    </div>
  </header>
  <nav aria-label="Sections">
    <span id="navind" aria-hidden="true"></span>
    <button data-v="daily" aria-selected="true">Daily</button>
    <button data-v="interview" aria-selected="false">Interview</button>
    <button data-v="learn" aria-selected="false">Learn</button>
    <button data-v="labs" aria-selected="false">Labs</button>
    <button data-v="desk" aria-selected="false">Desk</button>
    <button data-v="backtest" aria-selected="false">Backtest</button>
    <button data-v="games" aria-selected="false">Games</button>
    <button data-v="profile" aria-selected="false">Profile</button>
    <button data-v="log" aria-selected="false">Log</button>
  </nav>
  <main>
    <section class="panel" id="v-interview" hidden></section>
    <section class="panel" id="v-learn" hidden></section>
    <section class="panel" id="v-labs" hidden></section>
    <section class="panel" id="v-desk" hidden></section>
    <section class="panel" id="v-backtest" hidden></section>
    <section class="panel" id="v-daily"><div class="card"><p class="muted">Loading…</p></div></section>
    <section class="panel" id="v-games" hidden></section>
    <section class="panel" id="v-profile" hidden><div id="tab-progress" class="panel"></div></section>
    <section class="panel" id="v-log" hidden></section>
  </main>
  <div class="foot"><button class="btn ghost chip" type="button" data-feedback>Give feedback on this page</button><p>Built by Chakshu Chopra · Questions adapt to what you get wrong · <a href="#log">Practice log</a></p></div>
</div>
<noscript><p style="text-align:center">Quant Desk needs JavaScript to run.</p></noscript>
<script src="assets/lessons.js"></script>
<script src="assets/engine.js"></script>
<script src="assets/feedback.js"></script>
<script src="assets/labs.js"></script>
<script src="assets/sims.js"></script>
<script src="assets/desk.js"></script>
<script src="assets/backtest.js"></script>
<script src="assets/interview.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
